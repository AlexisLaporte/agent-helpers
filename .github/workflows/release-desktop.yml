name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri:build -- -- --features tray

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT

      - name: Prepare release artifacts
        id: artifacts
        run: |
          BUNDLE=apps/desktop-tauri/src-tauri/target/release/bundle
          mkdir -p release-artifacts

          # Copy deb and AppImage
          cp "$BUNDLE"/deb/*.deb release-artifacts/
          cp "$BUNDLE"/appimage/*.AppImage release-artifacts/

          # Read signature from the AppImage.tar.gz.sig (used by updater)
          SIG=$(cat "$BUNDLE"/appimage/*.AppImage.tar.gz.sig)
          echo "SIGNATURE=$SIG" >> $GITHUB_OUTPUT

          # List what we have
          ls -la release-artifacts/
          echo "Signature: $SIG"

      - name: Generate latest.json for updater
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat > release-artifacts/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/AlexisLaporte/claude-code-manager/releases/download/desktop-v${VERSION}/Claude.Code.Manager_${VERSION}_amd64.AppImage.tar.gz",
                "signature": "${{ steps.artifacts.outputs.SIGNATURE }}"
              }
            }
          }
          ENDJSON
          cat release-artifacts/latest.json

      - name: Copy tar.gz for updater
        run: |
          BUNDLE=apps/desktop-tauri/src-tauri/target/release/bundle
          cp "$BUNDLE"/appimage/*.AppImage.tar.gz release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
