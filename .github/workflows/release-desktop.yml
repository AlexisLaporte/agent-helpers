name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- -- --features tray

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT

      - name: Sign AppImage and prepare artifacts
        id: artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop-tauri
        run: |
          BUNDLE=src-tauri/target/release/bundle
          mkdir -p release-artifacts

          # Find the AppImage
          APPIMAGE=$(find "$BUNDLE/appimage" -name "*.AppImage" -type f)
          echo "Found AppImage: $APPIMAGE"

          # Sign it manually
          npx tauri signer sign "$APPIMAGE" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Signature file:"
          ls -la "${APPIMAGE}.sig"

          SIG=$(cat "${APPIMAGE}.sig")
          echo "SIGNATURE=$SIG" >> $GITHUB_OUTPUT

          # Copy artifacts with clean names (no spaces)
          VERSION=${{ steps.version.outputs.VERSION }}
          cp "$APPIMAGE" "release-artifacts/Claude.Code.Manager_${VERSION}_amd64.AppImage"
          find "$BUNDLE/deb" -name "*.deb" -exec cp {} "release-artifacts/Claude.Code.Manager_${VERSION}_amd64.deb" \;

      - name: Generate latest.json for updater
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat > apps/desktop-tauri/release-artifacts/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/AlexisLaporte/claude-code-manager/releases/download/desktop-v${VERSION}/Claude.Code.Manager_${VERSION}_amd64.AppImage",
                "signature": "${{ steps.artifacts.outputs.SIGNATURE }}"
              }
            }
          }
          ENDJSON
          cat apps/desktop-tauri/release-artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/desktop-tauri/release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
