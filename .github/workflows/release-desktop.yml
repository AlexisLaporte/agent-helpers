name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop-tauri
        run: npm run tauri:build -- -- --features tray

      - name: List built artifacts
        run: |
          ls -la apps/desktop-tauri/src-tauri/target/release/bundle/deb/ || true
          ls -la apps/desktop-tauri/src-tauri/target/release/bundle/appimage/ || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload .AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: apps/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT

      - name: Generate latest.json for updater
        run: |
          cat > artifacts/latest.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/AlexisLaporte/claude-code-manager/releases/download/desktop-v${{ steps.version.outputs.VERSION }}/Claude.Code.Manager_${{ steps.version.outputs.VERSION }}_amd64.AppImage",
                "signature": ""
              }
            }
          }
          EOF
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/latest.json
          draft: false
          prerelease: false
          generate_release_notes: true
