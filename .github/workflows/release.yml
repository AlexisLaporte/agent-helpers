name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Linux package
        run: npm run package:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: apps/desktop/dist/*.deb

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS package
        run: npm run package:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: apps/desktop/dist/*.dmg

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## Agent Helpers v${{ steps.version.outputs.VERSION }}

            **Desktop app for managing Claude Code customizations**

            ### Installation

            **Quick install (Linux & macOS):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/AlexisLaporte/agent-helpers/master/scripts/install-latest.sh | bash
            ```

            **Manual install:**
            - **Linux**: Download `agent-helpers_${{ steps.version.outputs.VERSION }}_amd64.deb` below
            - **macOS**: Download `agent-helpers-${{ steps.version.outputs.VERSION }}.dmg` below

            ### Features

            - 📂 Browse & manage skills, commands, agents, output-styles
            - 📝 Edit CLAUDE.md, settings, hooks
            - 🔄 Multi-project support
            - 🔎 Duplicates detection
            - 📦 Bundled starter templates

            ---

            **Full changelog**: https://github.com/${{ github.repository }}/commits/v${{ steps.version.outputs.VERSION }}
          files: |
            dist/*.deb
            dist/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
