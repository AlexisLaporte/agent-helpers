name: Sync to 321 Fork

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 321 fork
        uses: actions/checkout@v4
        with:
          repository: 321founded/agent-helpers
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0 # Full history for proper merging

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Add personal repo as upstream
        run: |
          git remote add upstream https://github.com/AlexisLaporte/agent-helpers.git
          git fetch upstream

      - name: Merge changes from personal repo
        run: |
          # Merge upstream master into current branch
          git merge upstream/master --no-edit || {
            echo "Merge conflict detected. Manual intervention required."
            exit 1
          }

      - name: Push to 321 fork
        run: git push origin master
