<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>

  <!-- Robot/Agent icon in white -->
  <g fill="#FFFFFF">
    <!-- Head -->
    <rect x="33" y="22" width="34" height="28" rx="4" ry="4"/>

    <!-- Eyes -->
    <circle cx="42" cy="33" r="4" fill="#3B82F6"/>
    <circle cx="58" cy="33" r="4" fill="#3B82F6"/>

    <!-- Smile/mouth -->
    <path d="M 40 42 Q 50 47 60 42" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Antenna -->
    <line x1="50" y1="22" x2="50" y2="14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="14" r="4"/>

    <!-- Body -->
    <rect x="36" y="52" width="28" height="24" rx="3" ry="3"/>

    <!-- Arms with tool icons -->
    <rect x="22" y="56" width="13" height="4" rx="2" ry="2"/>
    <rect x="65" y="56" width="13" height="4" rx="2" ry="2"/>

    <!-- Tool symbols on arms - wrench and gear -->
    <path d="M 27 63 L 30 66 L 28 68 L 25 65 Z" fill="#FFFFFF"/>
    <circle cx="71" cy="65" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="71" cy="65" r="1" fill="#FFFFFF"/>

    <!-- Legs -->
    <rect x="40" y="76" width="6" height="12" rx="2" ry="2"/>
    <rect x="54" y="76" width="6" height="12" rx="2" ry="2"/>
  </g>
</svg>
