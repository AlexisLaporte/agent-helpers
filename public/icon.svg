    <rect x="25" y="-8" width="15" height="16" fill="#10B981"/>
    <rect x="-30" y="-30" width="12" height="12" fill="#10B981" transform="rotate(45)"/>
    <rect x="18" y="-30" width="12" height="12" fill="#10B981" transform="rotate(45)"/>
    <rect x="-30" y="18" width="12" height="12" fill="#10B981" transform="rotate(45)"/>
    <rect x="18" y="18" width="12" height="12" fill="#10B981" transform="rotate(45)"/>
