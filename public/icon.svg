<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#3B82F6"/>

  <!-- Robot head base -->
  <rect x="156" y="180" width="200" height="180" rx="30" fill="#FFFFFF"/>

  <!-- Antenna -->
  <circle cx="256" cy="140" r="12" fill="#F59E0B"/>
  <rect x="252" y="140" width="8" height="40" fill="#F59E0B"/>

  <!-- Eyes -->
  <circle cx="210" cy="240" r="20" fill="#3B82F6"/>
  <circle cx="302" cy="240" r="20" fill="#3B82F6"/>
  <circle cx="215" cy="235" r="8" fill="#FFFFFF"/>
  <circle cx="307" cy="235" r="8" fill="#FFFFFF"/>

  <!-- Smile -->
